## 1. BUSINESS REQUIREMENTS (YÊU CẦU KINH DOANH)

### 1.1 Bối cảnh (Background)
Trong kỷ nguyên số hóa, nhu cầu quản lý và thực hiện giao dịch trực tuyến ngày càng trở nên cấp thiết. Các phương thức quản lý truyền thống bộc lộ nhiều điểm nghẽn: tốn kém thời gian, dễ thất lạc dữ liệu, tỷ lệ sai sót thủ công cao và thiếu khả năng thống kê tức thì.

### 1.2 Cơ hội kinh doanh (Business Opportunity)
Xây dựng một nền tảng số hóa tập trung giúp kết nối trực tiếp giữa người dùng và nhà cung cấp dịch vụ, tối ưu hóa quy trình tiếp nhận, xử lý và giám sát giao dịch với chi phí vận hành tối thiểu.

### 1.3 Mục tiêu kinh doanh & Tiêu chí thành công (Business Objectives & Success Metrics)
- **BO-1:** Giảm ít nhất 50% thời gian chờ đợi xử lý yêu cầu nghiệp vụ trong 3 tháng đầu tiên.
- **BO-2:** Đạt mức độ hài lòng của khách hàng (CSAT) tối thiểu 85% trong khảo sát sau sử dụng.
- **BO-3:** Giảm tỷ lệ huỷ hẹn / hủy đơn bất ngờ xuống dưới 10% nhờ hệ thống thông báo nhắc nhở tự động.

---

## 2. VISION STATEMENT (TUYÊN NGÔN TẦM NHÌN)

> **Dành cho:** Khách hàng và đối tác cần một giải pháp quản lý & giao dịch nhanh chóng  
> **Người đang gặp vấn đề:** Mất nhiều thời gian xếp hàng, quản lý lịch trình thủ công rời rạc  
> **Sản phẩm của chúng tôi:** [Tên sản phẩm]  
> **Là một:** Nền tảng ứng dụng đa nền tảng hiện đại  
> **Giúp:** Tự động hóa quy trình đặt chỗ, thanh toán trực tuyến và cập nhật trạng thái theo thời gian thực  
> **Khác với:** Các hệ thống phân tán, ghi sổ truyền thống hoặc các ứng dụng đơn lẻ thiếu đồng bộ  
> **Sản phẩm của chúng tôi:** Đem lại trải nghiệm liền mạch, an toàn bảo mật và khả năng phân tích báo cáo toàn diện.

---

## 3. SCOPE AND LIMITATIONS (PHẠM VI DỰ ÁN)

### 3.1 Phạm vi bản phát hành đầu tiên (In-Scope for Release 1.0 - MVP)
1. **Module Tài khoản & Phân quyền:** Đăng ký, đăng nhập, bảo vệ dữ liệu người dùng, phân quyền RBAC.
2. **Module Tìm kiếm & Khám phá:** Bộ lọc thông minh theo danh mục, vị trí, giá, thời gian.
3. **Module Đặt dịch vụ & Xử lý giao dịch:** Chọn lịch, xác nhận, hủy lịch trước hạn.
4. **Module Tích hợp Thanh toán:** Cổng thanh toán trực tuyến và hóa đơn điện tử.
5. **Module Dashboard & Báo cáo cơ bản:** Thống kê lượt giao dịch và doanh thu cho quản lý.

### 3.2 Ngoài phạm vi phiên bản 1.0 (Out-of-Scope)
- Tích hợp trí tuệ nhân tạo (AI) gợi ý thông minh (sẽ triển khai ở Release 2.0).
- Hỗ trợ thanh toán quốc tế đa tiền tệ (chỉ hỗ trợ VNĐ ở MVP).
- Ứng dụng bản địa hóa đa ngôn ngữ (chỉ hỗ trợ Tiếng Việt ở MVP).

### Mục tiêu & Động lực (Goals & Motivations)
- Muốn chủ động đặt lịch dịch vụ trước ít nhất 1-2 ngày mà không cần gọi điện thoại thoại thoại.
- Muốn nhận được thông báo nhắc nhở trước giờ hẹn để sắp xếp công việc cá nhân.
- Xem được đánh giá thực tế và bảng giá minh bạch trước khi quyết định.

### Nỗi đau & Rào cản (Frustrations & Pain Points)
- Rất ghét việc phải chờ đợi xếp hàng tại chỗ từ 30 - 45 phút.
- Từng gặp trường hợp bị hủy lịch sát giờ mà không được bồi thường thỏa đáng.
- Mất thời gian nếu ứng dụng bắt nhập quá nhiều trường thông tin rườm rà.

### Empathy Map
- **Says (Nói):** "Tôi chỉ cần 3 bước là hoàn thành việc đặt lịch, đừng bắt tôi khai báo quá nhiều thứ".
- **Thinks (Nghĩ):** "Liệu thanh toán trước tiền dịch vụ có an toàn không? Có được hoàn tiền nếu huỷ sớm không?".
- **Does (Làm):** Thường sử dụng điện thoại thông minh vào giờ nghỉ trưa hoặc buổi tối để tìm kiếm dịch vụ.
- **Feels (Cảm thấy):** Bực bội khi hệ thống bị chậm, muốn mọi thứ nhanh chóng và chính xác.

# ⚡ YÊU CẦU PHI CHỨC NĂNG (NON-FUNCTIONAL REQUIREMENTS - NFRs)
### Phân loại theo mô hình FURPS+ (Hewlett-Packard / Karl Wiegers)

---

## 1. FUNCTIONALITY (AN TOÀN BẢO MẬT & PHÂN QUYỀN)
- **NFR-SEC-01 (Mã hóa đường truyền):** 100% dữ liệu trao đổi giữa máy khách và máy chủ phải được mã hóa bằng giao thức HTTPS/TLS 1.3 với chứng chỉ SSL hợp lệ.
- **NFR-SEC-02 (Mã hóa mật khẩu):** Mật khẩu người dùng không bao giờ được lưu dưới dạng văn bản thuần (plain text); bắt buộc phải được mã hóa bằng thuật toán băm an toàn (BCrypt với cost factor >= 12 hoặc Argon2id).
- **NFR-SEC-03 (Kiểm soát truy cập - RBAC):** Hệ thống phải thực thi kiểm tra quyền nghiêm ngặt tại tầng API đối với mọi endpoint yêu cầu quyền Admin hoặc Provider.
- **NFR-SEC-04 (Bảo vệ phiên làm việc):** Phiên làm việc (Session) sẽ tự động hết hạn và yêu cầu đăng nhập lại sau 30 phút nếu không có bất kỳ tương tác nào từ phía người dùng.

---

## 2. USABILITY (KHẢ NĂNG SỬ DỤNG & TRẢI NGHIỆM NGƯỜI DÙNG)
- **NFR-USA-01 (Thời gian hoàn thành thao tác):** Người dùng thông thường có thể hoàn thành luồng đặt lịch dịch vụ trong vòng không quá 3 phút (tối đa 4 bước màn hình).
- **NFR-USA-02 (Tính đáp ứng giao diện - Responsive):** Giao diện web/app phải hiển thị mượt mà và trực quan trên các kích thước màn hình phổ biến từ 375px (iPhone SE) đến 1920px (Desktop Full HD).
- **NFR-USA-03 (Thông báo lỗi thân thiện):** Tất cả các thông báo lỗi hiển thị cho người dùng phải rõ ràng bằng tiếng Việt, giải thích nguyên nhân và hướng dẫn cách khắc phục, tuyệt đối không hiển thị mã lỗi kỹ thuật (ví dụ: Stack trace hoặc SQL Exception).

---

## 3. RELIABILITY (ĐỘ TIN CẬY & TÍNH KHẢ DỤNG)
- **NFR-REL-01 (Độ khả dụng - Availability):** Hệ thống phải đảm bảo thời gian hoạt động liên tục (Uptime) tối thiểu 99.5% mỗi tháng (tương đương thời gian gián đoạn tối đa không quá 3.65 giờ/tháng).
- **NFR-REL-02 (Sao lưu dữ liệu - Backup):** Toàn bộ cơ sở dữ liệu phải được tự động sao lưu định kỳ 24 giờ một lần (Automated Daily Backup) và được lưu trữ phân tán tại vị trí địa lý độc lập.
- **NFR-REL-03 (Khôi phục thảm họa - RTO & RPO):**
  - **RTO (Recovery Time Objective):** Thời gian phục hồi hệ thống sau sự cố sập máy chủ tối đa là 2 giờ.
  - **RPO (Recovery Point Objective):** Mất mát dữ liệu tối đa chấp nhận được không vượt quá 1 giờ dữ liệu giao dịch.

---

## 4. PERFORMANCE (HIỆU NĂNG & KHẢ NĂNG TẢI)
- **NFR-PERF-01 (Thời gian phản hồi):** Trong điều kiện tải thông thường, 90% các tác vụ tìm kiếm và xem trang phải trả về kết quả trong thời gian dưới 1.2 giây.
- **NFR-PERF-02 (Tải đồng thời - Concurrency):** Hệ thống phải duy trì hoạt động ổn định khi có ít nhất 1.000 người dùng truy cập và thao tác đồng thời tại cùng một thời điểm.
- **NFR-PERF-03 (Băng thông & Kích thước trang):** Dung lượng tải về của trang chủ (Landing Page) lần đầu tiên không được vượt quá 2.5 MB.

---

## 5. SUPPORTABILITY (KHẢ NĂNG BẢO TRÌ & MỞ RỘNG)
- **NFR-SUP-01 (Kiến trúc phân tầng):** Hệ thống phải được thiết kế theo kiến trúc phân tách rõ ràng (Clean Architecture / RESTful APIs), cho phép thay thế giao diện người dùng mà không cần sửa đổi logic nghiệp vụ phía backend.
- **NFR-SUP-02 (Nhật ký hệ thống - Logging):** Hệ thống phải tự động ghi log mọi giao dịch tài chính, thay đổi phân quyền và ngoại lệ hệ thống vào file log tập trung để hỗ trợ truy vết lỗi.

# ⚖️ QUY TẮC NGHIỆP VỤ HỆ THỐNG (BUSINESS RULES - BRs)

> Phân loại theo 5 loại chuẩn của Karl Wiegers: **Fact, Constraint, Action Enabler, Inference, Computation**.

---

## BẢNG TỔNG HỢP QUY TẮC NGHIỆP VỤ

| Mã BR | Tên quy tắc | Loại quy tắc (Type) | Mô tả chi tiết quy tắc nghiệp vụ | FRs / UCs thực thi |
| :---: | :--- | :---: | :--- | :--- |
| **BR-01** | Quyền đăng nhập hệ thống | **Constraint** | Chỉ những tài khoản có trạng thái \`Active\` và đã xác thực email/số điện thoại mới được phép đăng nhập. | \`FR-AUTH-03\`, \`UC-01\` |
| **BR-02** | Độ phức tạp của mật khẩu | **Constraint** | Mật khẩu phải có độ dài từ 8 đến 32 ký tự, bao gồm ít nhất 1 chữ cái in hoa, 1 chữ cái thường, 1 chữ số và 1 ký tự đặc biệt (@, #, $, %, !). | \`FR-AUTH-01\`, \`UC-01\` |
| **BR-03** | Khóa tài khoản tạm thời | **Action Enabler** | Nếu người dùng nhập sai mật khẩu quá 5 lần liên tiếp trong khoảng thời gian 10 phút, hệ thống tự động khóa đăng nhập 15 phút. | \`FR-AUTH-04\`, \`UC-01\` |
| **BR-04** | Giữ chỗ lịch hẹn tạm thời | **Action Enabler** | Khi khách hàng chọn khung giờ và bấm "Tiến hành thanh toán", hệ thống tạm thời giữ chỗ (lock slot) trong 10 phút. Nếu quá thời gian chưa thanh toán, slot tự động mở lại cho người khác. | \`FR-BOK-02\`, \`UC-03\` |
| **BR-05** | Chính sách hủy hẹn & hoàn tiền | **Computation** | - Hủy trước giờ hẹn > 24 giờ: Hoàn 100% tiền.<br>- Hủy trước giờ hẹn từ 12 - 24 giờ: Phí phạt 30%, hoàn 70%.<br>- Hủy trước giờ hẹn < 12 giờ hoặc vắng mặt: Phí phạt 100%, không hoàn tiền. | \`FR-BOK-04\`, \`UC-04\` |
| **BR-06** | Định nghĩa khách hàng VIP | **Inference** | Khách hàng có tổng chi tiêu trong năm dương lịch đạt từ 10.000.000 VNĐ trở lên được tự động xếp hạng \`Thành viên VIP\` và được giảm giá 5% cho mọi dịch vụ. | \`FR-CUST-02\`, \`UC-04\` |
| **BR-07** | Đơn vị tiền tệ và định dạng | **Fact** | Đơn vị tiền tệ chính thức của hệ thống là Việt Nam Đồng (VNĐ). Mọi số tiền hiển thị trên giao diện phải có dấu phân cách hàng nghìn (ví dụ: \`150,000 VNĐ\`). | \`FR-PAY-01\`, \`UC-03\` |
| **BR-08** | Lịch làm việc của nhà cung cấp | **Constraint** | Mỗi nhà cung cấp dịch vụ không được phép mở quá 12 ca hẹn trong một ngày làm việc để đảm bảo chất lượng dịch vụ. | \`FR-ADM-02\`, \`UC-08\` |

# 📑 USE CASE SPECIFICATION: UC-01
## ĐĂNG KÝ VÀ ĐĂNG NHẬP HỆ THỐNG (AUTHENTICATION)

---

## 1. THÔNG TIN CƠ BẢN
- **Use Case ID:** \`UC-01\`
- **Use Case Name:** Đăng ký và Đăng nhập hệ thống
- **Primary Actor:** Khách vãng lai (Guest) / Người dùng đã đăng ký (Registered User)
- **Secondary Actor:** Hệ thống gửi Email / SMS OTP
- **Scope:** Hệ thống phần mềm [Tên Hệ Thống]
- **Level:** User Goal
- **Priority:** High (Must-have)

---

## 2. TIỀN ĐIỀU KIỆN & HẬU ĐIỀU KIỆN (PRE & POST-CONDITIONS)
- **Preconditions:**
  - Người dùng có thiết bị kết nối mạng Internet ổn định và truy cập vào giao diện hệ thống.
- **Postconditions (Success Guarantee):**
  - Người dùng được xác thực danh tính thành công.
  - Hệ thống sinh phiên đăng nhập (JWT token), điều hướng người dùng tới Dashboard tương ứng với vai trò.

---

## 3. MAIN SUCCESS SCENARIO (LUỒNG CHÍNH - ĐĂNG NHẬP)

| Bước | Hành động của Actor | Phản hồi của Hệ thống |
| :---: | :--- | :--- |
| **1** | Người dùng mở trang đăng nhập và nhập Email/Số điện thoại cùng Mật khẩu. | Hệ thống kiểm tra cú pháp định dạng cơ bản của dữ liệu đầu vào. |
| **2** | Người dùng bấm nút "Đăng nhập". | Hệ thống kiểm tra sự tồn tại của tài khoản, trạng thái tài khoản [BR-01], và so khớp mật khẩu mã hóa. |
| **3** | | Hệ thống xác thực thành công, ghi nhận lịch sử đăng nhập vào Audit Log, reset bộ đếm lần đăng nhập sai về 0. |
| **4** | | Hệ thống cấp Access Token và điều hướng người dùng về trang chủ/bảng điều khiển với giao diện tương ứng theo vai trò. |

\`\`\`mermaid
sequenceDiagram
    autonumber

    UI->>API: POST /api/bookings/{id}/checkout
    activate API

    DB-->>API: Trả về trạng thái hợp lệ
    API->>GW: Gửi yêu cầu khởi tạo thanh toán (OrderID, Amount, Checksum)
    activate GW
    GW-->>API: Trả về Payment URL
    deactivate GW
    API-->>UI: Redirect URL sang trang thanh toán
    deactivate API

    UI->>User: Hiển thị cổng thanh toán VNPay
    User->>GW: Nhập OTP / Quét mã QR thanh toán
    activate GW
    GW->>GW: Xử lý trừ tiền tài khoản ngân hàng

    end
    deactivate API

# ✅ CHECKLIST ĐÁNH GIÁ CHẤT LƯỢNG SRS (VERIFICATION & VALIDATION)
### 8 Đặc tính chất lượng yêu cầu phần mềm theo chuẩn IEEE 830 / ISO 29148

---

## 1. BẢNG CHECKLIST ĐÁNH GIÁ CHI TIẾT

| Tiêu chuẩn chất lượng (Quality Attribute) | Câu hỏi kiểm tra (Verification Questions) | Đạt (Pass/Fail) | Ghi chú / Điểm cần sửa |
| :--- | :--- | :---: | :--- |
| **1. Correctness (Tính đúng đắn)** | Mọi yêu cầu có phản ánh chính xác mong muốn thực tế của khách hàng và nghiệp vụ không? | [ ] Pass | |
| **2. Unambiguous (Tính không mơ hồ)** | Mỗi yêu cầu chỉ có DUY NHẤT một cách hiểu? Không chứa các từ cảm tính như "nhanh chóng", "thân thiện", "tối ưu", "dễ dùng"? | [ ] Pass | Rà soát từ mơ hồ |
| **3. Completeness (Tính đầy đủ)** | Đã mô tả đầy đủ cả luồng thành công lẫn luồng ngoại lệ/lỗi? Đầy đủ tham số đầu vào và đầu ra? | [ ] Pass | |
| **4. Consistency (Tính nhất quán)** | Các yêu cầu không mâu thuẫn lẫn nhau về mặt thuật ngữ, logic nghiệp vụ hoặc phân quyền? | [ ] Pass | |
| **5. Ranked for Importance (Độ ưu tiên)** | Mọi yêu cầu đã được phân loại mức độ quan trọng theo MoSCoW (Must, Should, Could, Won't)? | [ ] Pass | |
| **6. Verifiable / Testable (Kiểm chứng được)** | Đội ngũ QA/Tester có thể thiết kế ít nhất 1 kịch bản kiểm thử (Test Case) cụ thể để pass/fail yêu cầu này không? | [ ] Pass | |
| **7. Modifiable (Dễ sửa đổi)** | Tài liệu có mục lục rõ ràng, mã hóa ID duy nhất (FR-xx, BR-xx), không bị lặp lại nội dung ở nhiều nơi? | [ ] Pass | |
| **8. Traceable (Khả năng truy vết)** | Mỗi yêu cầu có truy ngược được về mục tiêu kinh doanh (Backward) và truy xuôi đến Use Case/Test Case (Forward)? | [ ] Pass | Xem tại RTM |
